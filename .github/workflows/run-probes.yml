# Reusable probe runner (workflow_call): fans out over targets × probe kinds and runs the
# playwright-synthetic-probe composite action for each. Called by probe.yml on cron/dispatch;
# any future caller (e.g. a status-page refresh workflow) gets the identical probe behavior.
name: run-probes

on:
  workflow_call:
    inputs:
      source:
        description: "source label for pushed metrics"
        type: string
        default: "cron"
      scheduler:
        description: "scheduler label for pushed metrics: gha | external | manual"
        type: string
        default: "gha"
    secrets:
      GRAFANA_PUSH_URL:
        required: false
      GRAFANA_PUSH_USER:
        required: false
      GRAFANA_PUSH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: saucedemo
            kind: journey
          - target: githubstatus
            kind: api
    steps:
      # First step, before checkout or any setup: this timestamp is what the cron-jitter
      # metric measures against, so it must not include job setup time.
      - name: Capture tick timestamp
        run: echo "PROBE_TICK_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Run synthetic probe
        uses: ./.github/actions/playwright-synthetic-probe
        with:
          target: ${{ matrix.target }}
          kind: ${{ matrix.kind }}
          source: ${{ inputs.source }}
          scheduler: ${{ inputs.scheduler }}
          push-url: ${{ secrets.GRAFANA_PUSH_URL }}
          push-user: ${{ secrets.GRAFANA_PUSH_USER }}
          push-token: ${{ secrets.GRAFANA_PUSH_TOKEN }}

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.target }}-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
