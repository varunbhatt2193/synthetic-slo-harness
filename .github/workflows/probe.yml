# The scheduler. GHA cron is best-effort — the actual firing delay is itself a measured
# metric (synthetic_cron_jitter_seconds) and sets the floor on detection time; see README.
name: probe

on:
  schedule:
    # Offset minutes, not */15: GitHub sheds cron load at the popular :00/:15/:30/:45
    # marks (observed here as multi-hour skip streaks around UTC midnight). Same 15-min
    # grid, shifted by 4 min — keep CRON_OFFSET_S in src/slo_harness/metrics.py in sync.
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      as_cron:
        description: >-
          Set by an external scheduler pinging this workflow on the same 15-min grid when
          GHA cron is starved; labels metrics source=cron instead of source=manual.
        type: boolean
        default: false

# Never let a slow run overlap the next tick; queue instead of cancel so gaps in the
# availability series mean "target was slow", not "we discarded the run".
concurrency:
  group: synthetic-probes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probes:
    uses: ./.github/workflows/run-probes.yml
    with:
      source: ${{ (github.event_name == 'schedule' || inputs.as_cron == true) && 'cron' || 'manual' }}
      # Provenance, orthogonal to source: `source` keeps SLO continuity across schedulers,
      # `scheduler` records who actually fired the tick. Jitter evidence is gated on
      # scheduler=gha so externally-pinged ticks never contaminate the GHA-cron measurements.
      scheduler: ${{ github.event_name == 'schedule' && 'gha' || (inputs.as_cron == true && 'external' || 'manual') }}
    secrets: inherit
