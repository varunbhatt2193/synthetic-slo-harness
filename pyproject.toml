[project]
name = "slo-harness"
version = "0.1.0"
description = "GitHub Actions-native synthetic monitoring with SLO burn-rate alerting — and a harness that scores the monitoring itself against injected faults"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.27",
    "cramjam>=2.8",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-playwright>=0.5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slo_harness"]

[tool.pytest.ini_options]
# Unit tests only by default; probes are run explicitly (`pytest probes`) because
# they hit live targets and are the *product*, not the test suite.
testpaths = ["tests"]
markers = [
    "probe: live synthetic probe against a real target (excluded from CI unit runs)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Reused verbatim from pytest-ai-triage; not restyled here so the two copies stay diffable.
"service/app.py" = ["SIM"]
